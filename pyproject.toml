[project]
name = "apex-agent"
version = "0.1.0"
description = "Autonomous Personal Memory Agent for Founders and Knowledge Workers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.20.0",
    "pdfplumber>=0.10.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "sentence-transformers>=2.5.0",
    "numpy>=1.24.0",
    "lancedb>=0.6.0",
    "pyarrow>=15.0.0",
    "watchdog>=4.0.0"
]

[project.optional-dependencies]
vector = [
    "qdrant-client>=1.9.0",
    "lancedb>=0.10.0",
    "pyarrow>=16.0.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "qdrant-client>=1.9.0",
    "lancedb>=0.10.0",
    "pyarrow>=16.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
apex = "apex_agent.cli:app"
